services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factura
      POSTGRES_PASSWORD: factura
      POSTGRES_DB: factura
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factura"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://factura:factura@db:5432/factura
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
